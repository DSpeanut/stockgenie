<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Genie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --purple-50: #faf5ff;
            --purple-100: #f3e8ff;
            --purple-200: #e9d5ff;
            --purple-300: #d8b4fe;
            --purple-500: #a855f7;
            --purple-600: #9333ea;
            --purple-700: #7e22ce;
            --purple-800: #6b21a8;
            --purple-900: #581c87;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-400: #9ca3af;
            --gray-600: #4b5563;
            --gray-900: #111827;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--purple-50) 0%, #ffffff 100%);
            color: var(--gray-900);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-header {
            width: 100%;
            max-width: 800px;
            padding: 24px 20px 16px;
            text-align: center;
        }

        .app-header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--purple-900);
            letter-spacing: -0.02em;
        }

        .app-header p {
            margin: 4px 0 0;
            font-size: 0.875rem;
            color: var(--gray-400);
            font-weight: 500;
        }

        #chat-container {
            width: 100%;
            max-width: 800px;
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 12px;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 20px;
            line-height: 1.5;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease-out;
            word-wrap: break-word;
        }

        .message h1, .message h2, .message h3, .message h4, .message h5, .message h6 {
            margin: 0 0 8px 0;
            color: var(--purple-900);
            font-weight: 600;
            font-size: inherit;
        }

        .message p {
            margin: 0 0 12px 0;
        }
        .message p:last-child {
            margin-bottom: 0;
        }

        .message ul, .message ol {
            margin: 0 0 12px 0;
            padding-left: 20px;
        }

        .message li {
            margin-bottom: 4px;
        }

        .message strong {
            color: var(--purple-700);
        }

        .message code {
            background: var(--purple-50);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .message pre {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
            margin: 0 0 12px 0;
        }
        .message pre code {
            background: none;
            padding: 0;
        }

        .message blockquote {
            border-left: 3px solid var(--purple-300);
            margin: 0 0 12px 0;
            padding: 4px 12px;
            color: var(--gray-600);
        }

        .message table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        .message th,
        .message td {
            border: 1px solid var(--gray-200);
            padding: 10px 12px;
            text-align: left;
            vertical-align: top;
        }

        .message th {
            background: var(--purple-50);
            color: var(--gray-900);
        }

        .message tr:nth-child(even) {
            background: #fafafa;
        }

        .message hr {
            border: none;
            border-top: 1px solid var(--gray-200);
            margin: 12px 0;
        }

        .user {
            background: linear-gradient(135deg, var(--purple-600), var(--purple-800));
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            box-shadow: 0 4px 12px rgba(109, 40, 217, 0.25);
        }

        .agent {
            background-color: #ffffff;
            color: var(--gray-900);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--purple-100);
        }

        .typing-indicator {
            align-self: flex-start;
            background-color: #ffffff;
            border: 1px solid var(--purple-100);
            border-radius: 20px;
            border-bottom-left-radius: 6px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            animation: fadeIn 0.3s ease-out;
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            background-color: var(--purple-500);
            border-radius: 50%;
            display: inline-block;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #input-container {
            width: 100%;
            max-width: 800px;
            padding: 0 20px 24px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #question {
            flex: 1;
            padding: 14px 20px;
            border: 1px solid var(--purple-200);
            border-radius: 24px;
            font-family: inherit;
            font-size: 0.95rem;
            background-color: #ffffff;
            color: var(--gray-900);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #question::placeholder {
            color: var(--gray-400);
        }

        #question:focus {
            border-color: var(--purple-500);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
        }

        button {
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--purple-600), var(--purple-800));
            color: white;
            border: none;
            border-radius: 24px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(109, 40, 217, 0.25);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(109, 40, 217, 0.35);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: var(--gray-200);
            color: var(--gray-400);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        @media (max-width: 600px) {
            .app-header h1 {
                font-size: 1.25rem;
            }
            #chat-container {
                padding: 12px;
            }
            .message {
                max-width: 90%;
                padding: 12px 16px;
            }
            #input-container {
                padding: 0 12px 16px;
            }
            button {
                padding: 12px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="app-header">
        <h1>Stock Genie</h1>
        <p>Your personal AI investing advisor</p>
    </div>
    <div id="chat-container"></div>

    <div id="input-container">
        <input type="text" id="question" placeholder="Ask about stocks, portfolios, or market trends..." />
        <label style="display:flex;align-items:center;gap:8px;font-size:0.9rem;margin-left:8px;">
            <input type="checkbox" id="format-hint" />
            <span>Format as Markdown</span>
        </label>
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        const threadId = 'web_' + Math.random().toString(36).substr(2, 9);

        function preprocessMarkdown(text) {
            var t = text;
            t = t.replace(/([^\n])(#{1,6}\s)/g, '$1\n$2');
            t = t.replace(/([^\n-])(\s*---)(\s*)([^\n-])/g, '$1\n---\n$4');
            t = t.replace(/([^\n])(>[^\n])/g, '$1\n$2');
            t = t.replace(/([^\n])([-*]\s)/g, '$1\n$2');
            return t;
        }

        function addMessage(text, isUser) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = 'message ' + (isUser ? 'user' : 'agent');
            div.innerHTML = isUser ? escapeHtml(text) : marked.parse(preprocessMarkdown(text));
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showTypingIndicator() {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = 'typing-indicator';
            div.id = 'typing-indicator';
            div.innerHTML = '<span></span><span></span><span></span>';
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) {
                indicator.remove();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('question');
            const button = document.getElementById('send-btn');
            const rawQuestion = input.value.trim();
            if (!rawQuestion) return;

            const useFormat = document.getElementById('format-hint')?.checked;
            const formattingHint = "Please format your answer in Markdown: use headings, bullet lists, and tables; avoid a single long paragraph.";
            const question = useFormat ? (formattingHint + "\n\n" + rawQuestion) : rawQuestion;

            addMessage(rawQuestion, true);
            input.value = '';
            button.disabled = true;
            button.textContent = 'Sending...';

            showTypingIndicator();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question: question,
                        thread_id: threadId
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                removeTypingIndicator();
                addMessage(data.answer, false);

            } catch (error) {
                removeTypingIndicator();
                console.error('Error:', error);
                addMessage('Error: Could not connect to server. ' + error.message, false);
            } finally {
                button.disabled = false;
                button.textContent = 'Send';
            }
        }

        document.getElementById('question').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
